name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Lint formatting
        run: make lint-format
      - name: Build (Swift 6, warnings as errors)
        run: make build-swift6
      - name: Test (Swift 6)
        run: make test-swift6
      - name: Test (Swift 5 language mode)
        run: make test-swift5
